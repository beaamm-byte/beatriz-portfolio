<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#32152d"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"><title>Propuesta privada · Agencia de viajes</title><style>*{box-sizing:border-box}body{margin:0;background:#32152d;color:#32152d;font-family:Arial,sans-serif}.login{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 20%,#764666,#32152d 65%)}.panel{width:min(440px,100%);background:#fffdf9;padding:clamp(26px,6vw,42px);box-shadow:0 25px 70px #14081270}.eyebrow{color:#c52e61;font-size:10px;font-weight:700;letter-spacing:.18em}.panel h1{font-family:Arial,sans-serif;font-weight:600;font-size:clamp(34px,8vw,46px);line-height:1.05;letter-spacing:-.04em;margin:17px 0}.panel p{font-size:13px;line-height:1.65;color:#766774}.panel label{display:grid;gap:7px;margin:18px 0;font-size:10px;font-weight:bold;letter-spacing:.12em}.panel input{width:100%;padding:13px;border:1px solid #f0d8cc;background:#fffaf5;font-size:14px;color:#32152d}.panel input:focus{outline:2px solid #f33d72;outline-offset:1px}.submit{width:100%;border:0;background:#f33d72;color:white;padding:15px;font-weight:bold;margin-top:12px}.error{color:#a33b50;min-height:20px}#project{display:none;height:100svh;flex-direction:column;background:#fffdf9}.project-bar{min-height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;background:#32152d;color:#fff;font-size:10px;font-weight:bold;letter-spacing:.08em}.project-tabs{display:flex;align-items:center;gap:3px;overflow-x:auto}.project-bar button{background:transparent;border:0;color:#fff;font:inherit;white-space:nowrap;padding:14px 12px;opacity:.72}.project-bar button.active{opacity:1;border-bottom:2px solid #ffe16b}.project-bar #close{color:#ffe16b}.project-frame{flex:1;min-height:0;width:100%;border:0}@media(max-width:620px){.project-bar{padding:0 7px;gap:3px;min-height:48px;font-size:8px}.project-bar button{padding:13px 7px}.project-brand{display:none!important}}</style><style>:root{--personal-paper:#f8f6f2;--personal-ink:#0d0d0d;--personal-red:#b5292a}body{background:var(--personal-paper);color:var(--personal-ink);font-family:'DM Sans',sans-serif}.login{position:relative;overflow:hidden;background:var(--personal-ink)}.login:before{content:"";position:absolute;inset:18px;border:1px solid #b5292a;pointer-events:none}.panel{position:relative;width:min(480px,100%);background:var(--personal-paper);padding:clamp(28px,6vw,48px);box-shadow:0 24px 70px #0005;border-left:4px solid var(--personal-red)}.eyebrow{color:var(--personal-red);font-family:'Bebas Neue',sans-serif;font-size:15px;letter-spacing:.16em}.panel h1{font-family:'DM Serif Display',serif;font-weight:400;font-size:clamp(38px,8vw,52px);line-height:1.02;letter-spacing:-.025em;color:var(--personal-ink)}.panel p{color:#55514e}.panel label{color:var(--personal-ink)}.panel input{border-color:#c8c2bb;background:#fff;color:var(--personal-ink);font-family:'DM Sans',sans-serif}.panel input:focus{outline:2px solid var(--personal-red);border-color:var(--personal-red)}.submit{background:var(--personal-red);color:#fff;font-family:'DM Sans',sans-serif}.submit:hover{background:#8f1e22}.project-bar{background:#0d0d0d;border-bottom:2px solid #b5292a}.project-bar button.active{border-bottom-color:#b5292a;color:#f8f6f2}.project-bar #close{color:#e1a4a2}@media(max-width:720px){.project-bar{background:#112f29;color:#fff;border-bottom:2px solid #e4a46b;min-height:44px;padding:0 6px;gap:2px;font-size:8px}.project[data-active="travel"] .project-bar{background:#32152d;border-bottom-color:#f33d72}.project-bar button{color:#fff;padding:12px 7px}.project-bar button.active{border-bottom-color:#e4a46b}.project[data-active="travel"] .project-bar button.active{border-bottom-color:#f33d72}.project-bar #close{color:#f1c29a}.project[data-active="travel"] .project-bar #close{color:#f3a2bf}.project-brand{display:none!important}.project.bar-hidden .project-bar{display:none}}</style></head><body><section id="login" class="login"><form class="panel" id="form"><div class="eyebrow">BEATRIZ MORÓN · VISTA PRIVADA</div><h1>Dos identidades.<br>Un mundo por recorrer.</h1><p>Explora las dos propuestas de agencia de viajes y la auditoría desde este acceso privado.</p><label>USUARIO<input id="user" autocomplete="username" required></label><label>CONTRASEÑA<input id="password" type="password" autocomplete="current-password" required></label><button class="submit" type="submit">Entrar al proyecto ›</button><p id="error" class="error" role="alert"></p></form></section><div id="project"><div class="project-bar"><span class="project-brand">BEATRIZ MORÓN · VISTA PRIVADA</span><nav class="project-tabs" aria-label="Cambiar propuesta"><button id="roadtripTab" class="active" type="button">IDENTIDAD ROADTRIP</button><button id="travelTab" type="button">IDENTIDAD TRAVEL</button><button id="close" type="button">SALIR ›</button></nav></div><iframe id="view" class="project-frame" title="Propuestas de identidad para agencia de viajes" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"></iframe></div><script>let content=null;const buttons={roadtrip:document.getElementById('roadtripTab'),travel:document.getElementById('travelTab')};const show=kind=>{document.getElementById('project').dataset.active=kind;document.getElementById('view').srcdoc=content[kind];Object.entries(buttons).forEach(([key,button])=>button.classList.toggle('active',key===kind))};document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';const button=e.target.querySelector('.submit');button.disabled=true;button.textContent='Abriendo…';try{const raw=new Uint8Array(await(await fetch('payload.bin',{cache:'no-store'})).arrayBuffer());const salt=raw.slice(0,16),iv=raw.slice(16,28),ciphertext=raw.slice(28,-16),tag=raw.slice(-16),material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('user').value.trim().toLowerCase()+'|'+document.getElementById('password').value),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']),combined=new Uint8Array(ciphertext.length+tag.length);combined.set(ciphertext);combined.set(tag,ciphertext.length);content=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,combined)));document.getElementById('password').value='';document.getElementById('login').style.display='none';document.getElementById('project').style.display='flex';show('roadtrip')}catch{error.textContent='Usuario o contraseña incorrectos.'}finally{button.disabled=false;button.textContent='Entrar al proyecto ›'}});buttons.roadtrip.onclick=()=>show('roadtrip');buttons.travel.onclick=()=>show('travel');document.getElementById('close').onclick=()=>location.reload();window.addEventListener('message',e=>{if(e.origin!==location.origin||!content)return;if(e.data==='travel-show-roadtrip')show('roadtrip');if(e.data==='travel-show-travel')show('travel');if(e.data&&e.data.type==='travel-demo-scroll'){if(innerWidth<=720){const previous=window.__demoScrollY||0;document.getElementById('project').classList.toggle('bar-hidden',e.data.y>25&&e.data.y>previous);window.__demoScrollY=e.data.y}}});</script></body></html>
