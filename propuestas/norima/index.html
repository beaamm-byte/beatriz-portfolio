<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Proyecto privado · Nórima</title><style>*{box-sizing:border-box}body{margin:0;background:#18352f;color:#18352f;font-family:Arial,sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 20%,#2b5a49,#18352f 60%)}.panel{width:min(440px,100%);background:#f7f4ec;padding:38px;box-shadow:0 25px 70px #071d1855}.icon{width:58px;height:58px;margin-bottom:20px}.eyebrow{color:#a9714d;font-size:10px;font-weight:700;letter-spacing:.2em}h1{font-family:Georgia,serif;font-weight:normal;font-size:42px;line-height:1.08;margin:13px 0}p{font-size:13px;line-height:1.65;color:#58695e}label{display:grid;gap:7px;margin:18px 0;font-size:10px;font-weight:bold;letter-spacing:.12em}input{width:100%;padding:13px;border:1px solid #ccd2c7;background:#fffdf8;font-size:14px;color:#18352f}button{cursor:pointer}.submit{width:100%;border:0;background:#e4a46b;color:#18352f;padding:15px;font-weight:bold;margin-top:12px}.error{color:#a33b34;min-height:20px}#project{display:none;height:100vh;flex-direction:column;background:#f7f4ec}.project-bar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#102b25;color:#fff;font-size:11px;font-weight:bold;letter-spacing:.08em}.project-bar button{background:transparent;border:0;color:#fff;font:inherit;padding:13px;opacity:.7}.project-bar button.active{opacity:1;border-bottom:2px solid #e4a46b}iframe{width:100%;height:calc(100vh - 48px);border:0}</style></head><body><section id="login" class="login"><form class="panel" id="form"><img class="icon" src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIGRlc2MiPgo8dGl0bGUgaWQ9InRpdGxlIj5Tw61tYm9sbyBOw7NyaW1hPC90aXRsZT48ZGVzYyBpZD0iZGVzYyI+VW5hIHB1ZXJ0YSBhYmllcnRhIGhhY2lhIHVuIGhvcml6b250ZSB5IHVuIHNvbDwvZGVzYz4KPGNpcmNsZSBjeD0iMzIiIGN5PSIzMiIgcj0iMzAiIGZpbGw9IiNlOWE5NmEiLz4KPHBhdGggZD0iTTE3IDQ4VjI3YzAtMTAgNi0xNyAxNS0xN3MxNSA3IDE1IDE3djIxSDE3WiIgZmlsbD0iIzE3MzQyZSIvPgo8cGF0aCBkPSJNMjMgNDNWMjdjMC02IDMuNS0xMSA5LTExczkgNSA5IDExdjE2SDIzWiIgZmlsbD0iI2U5YTk2YSIvPgo8Y2lyY2xlIGN4PSIzNSIgY3k9IjI4IiByPSI1IiBmaWxsPSIjZjdmNGVjIi8+CjxwYXRoIGQ9Ik0yMyAzOWgxOCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjMTczNDJlIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIi8+Cjwvc3ZnPgo=" alt=""><div class="eyebrow">BEATRIZ MORÓN · PROYECTO PRIVADO</div><h1>Una idea de viaje,<br>solo para ti.</h1><p>Accede a la maqueta interactiva y a su auditoría. El contenido permanece cifrado hasta introducir las credenciales.</p><label>USUARIO<input id="user" autocomplete="username" required></label><label>CONTRASEÑA<input id="password" type="password" autocomplete="current-password" required></label><button class="submit" type="submit">Entrar al proyecto ↗</button><p id="error" class="error" role="alert"></p></form></section><div id="project"><div class="project-bar"><span>NÓRIMA · VISTA PRIVADA</span><div><button id="demoTab" class="active" type="button">MAQUETA</button><button id="auditTab" type="button">AUDITORÍA</button><button id="close" type="button">SALIR ↗</button></div></div><iframe id="view" title="Proyecto Nórima" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-modals"></iframe></div><script>let content=null;const show=kind=>{document.getElementById('view').srcdoc=content[kind];document.getElementById('demoTab').classList.toggle('active',kind==='site');document.getElementById('auditTab').classList.toggle('active',kind==='audit')};document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const error=document.getElementById('error');error.textContent='';const button=e.target.querySelector('button');button.disabled=true;button.textContent='Abriendo…';try{const raw=new Uint8Array(await(await fetch('payload.bin',{cache:'no-store'})).arrayBuffer());const salt=raw.slice(0,16),iv=raw.slice(16,28),ciphertext=raw.slice(28);const username=document.getElementById('user').value.trim().toLowerCase(),password=document.getElementById('password').value;const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(username+'\0'+password),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);content=JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext)));document.getElementById('password').value='';document.getElementById('login').style.display='none';document.getElementById('project').style.display='flex';show('site')}catch{error.textContent='Usuario o contraseña incorrectos.'}finally{button.disabled=false;button.textContent='Entrar al proyecto ↗'}});document.getElementById('demoTab').onclick=()=>show('site');document.getElementById('auditTab').onclick=()=>show('audit');document.getElementById('close').onclick=()=>location.reload();window.addEventListener('message',e=>{if(e.origin===location.origin&&e.data==='norima-show-demo'&&content)show('site')});</script></body></html>
